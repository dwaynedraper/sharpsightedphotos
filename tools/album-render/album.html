<!doctype html><html><body style="margin:0;background:transparent">
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const W = 1600, H = 1200;
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.setPixelRatio(1); r.setClearColor(0x000000, 0);
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = Number(q.get('exp') || 0.9); r.outputColorSpace = THREE.SRGBColorSpace;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
const cam = new THREE.PerspectiveCamera(Number(q.get('fov') || 24), W / H, 0.1, 200);
cam.position.set(Number(q.get('cx') || 0), Number(q.get('cy') || 22), Number(q.get('cz') || 17)); cam.lookAt(0, 0.4, 0.6);

// procedural textures
function canvasTex(w, h, draw, rep) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; if (rep) t.repeat.set(rep[0], rep[1]); t.anisotropy = 8; return t; }
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const grain = canvasTex(512, 512, (g, w, h) => { const d = g.createImageData(w, h); for (let i = 0; i < d.data.length; i += 4) { const v = 118 + (rnd() - 0.5) * 90; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); for (let k = 0; k < 900; k++) { g.strokeStyle = `rgba(${rnd() < .5 ? 0 : 255},${rnd() < .5 ? 0 : 255},${rnd() < .5 ? 0 : 255},0)`; } }, [3, 3]);
const pagesSide = canvasTex(64, 512, (g, w, h) => { g.fillStyle = '#f7f6f2'; g.fillRect(0, 0, w, h); for (let y = 0; y < h; y += 3) { g.fillStyle = `rgba(120,118,112,${0.18 + rnd() * 0.2})`; g.fillRect(0, y, w, 1); } });
pagesSide.colorSpace = THREE.SRGBColorSpace;

const leather = new THREE.MeshPhysicalMaterial({ color: 0x242c40, roughness: 0.55, metalness: 0, bumpMap: grain, bumpScale: 0.9, roughnessMap: grain, sheen: 0.4, sheenRoughness: 0.6, sheenColor: 0x56607a, clearcoat: 0.15, clearcoatRoughness: 0.5 });
const pagesMatX = pagesSide.clone(); pagesMatX.needsUpdate = true; pagesMatX.rotation = Math.PI / 2; pagesMatX.center.set(0.5, 0.5); pagesMatX.repeat.set(1, 6);
const pageSide = new THREE.MeshStandardMaterial({ map: pagesSide, roughness: 0.9 });
const pageSide2 = new THREE.MeshStandardMaterial({ map: pagesMatX, roughness: 0.9 });
const pageTop = new THREE.MeshStandardMaterial({ color: 0xf7f6f2, roughness: 0.9 });
const acrylic = new THREE.MeshPhysicalMaterial({ color: 0xe9eef2, roughness: 0.04, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.03, reflectivity: 0.9, ior: 1.49, specularIntensity: 1 });

const album = new THREE.Group(); scene.add(album);
const AW = 12.4, AD = 9.4, CT = 0.16, PT = 0.95;
const back = new THREE.Mesh(new RoundedBoxGeometry(AW, CT, AD, 4, 0.05), leather); back.position.y = CT / 2; album.add(back);
// page block: materials order +x, -x, +y, -y, +z, -z
const pages = new THREE.Mesh(new THREE.BoxGeometry(AW - 0.5, PT, AD - 0.36), [pageSide2, pageSide2, pageTop, pageTop, pageSide, pageSide]);
pages.position.set(0.12, CT + PT / 2, 0); album.add(pages);
const front = new THREE.Mesh(new RoundedBoxGeometry(AW, CT, AD, 4, 0.05), leather); front.position.y = CT + PT + CT / 2; album.add(front);
const total = CT * 2 + PT;
const spine = new THREE.Mesh(new THREE.CylinderGeometry(total / 2, total / 2, AD, 48, 1, false), leather);
spine.rotation.x = Math.PI / 2; spine.scale.set(0.5, 1, 1); spine.position.set(-AW / 2 + 0.06, total / 2, 0); album.add(spine);
// the acrylic face that holds the cover photo
const FW = 10.6, FD = 8.4, FT = 0.2, FX = 0.62;
const face = new THREE.Mesh(new RoundedBoxGeometry(FW, FT, FD, 4, 0.07), acrylic); face.position.set(FX, total + FT / 2, 0); album.add(face);
const inset = 0.05;
const photo = new THREE.Mesh(new THREE.PlaneGeometry(FW - 2 * inset, FD - 2 * inset), new THREE.MeshBasicMaterial({ color: 0xbfc4cc }));
photo.rotation.x = -Math.PI / 2; photo.position.set(FX, total + FT + 0.002, 0); album.add(photo);
[back, front, spine, face, pages].forEach((m) => { m.castShadow = true; m.receiveShadow = true; });
album.rotation.y = Number(q.get('ry') || 0.42);

// light and a shadow catcher
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8dce6, 0.55));
const key = new THREE.DirectionalLight(0xfff6ea, Number(q.get('key') || 2.4)); key.position.set(-14, 16, 4); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 22; key.shadow.blurSamples = 25; key.shadow.bias = -0.0004;
Object.assign(key.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 60 }); scene.add(key);
const fill = new THREE.DirectionalLight(0xe8eeff, 0.6); fill.position.set(10, 8, 12); scene.add(fill);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ opacity: 0.32 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

r.render(scene, cam);
// photo corners in image pixels: top-left, top-right, bottom-right, bottom-left as the viewer reads the cover
scene.updateMatrixWorld(true);
const hw = (FW - 2 * inset) / 2, hd = (FD - 2 * inset) / 2;
const local = [[-hw, -hd], [hw, -hd], [hw, hd], [-hw, hd]].map(([x, z]) => new THREE.Vector3(FX + x, total + FT + 0.002, z));
const pts = local.map((v) => { const w = v.clone().applyMatrix4(album.matrixWorld).project(cam); return [+((w.x + 1) / 2 * W).toFixed(2), +((1 - w.y) / 2 * H).toFixed(2)]; });
window.corners = pts;
window.done = r.domElement.toDataURL('image/png');
</script></body></html>
